
method: sdpo
model_path: 

n_gpus_per_node: 2


# ============================================================
# LoRA
# ============================================================
use_lora: true
lora_r: 64
lora_alpha: 128


# ============================================================
# Optimization
# ============================================================
learning_rate: 5.0e-6

num_epochs: 30
per_device_batch_size: 4

group_size: 8

# 每次优化使用的样本数
ppo_mini_batch_size: 16

max_grad_norm: 0.1

warmup_steps: 0

weight_decay: 0.01

max_train_samples: 60000


# ============================================================
# Checkpoint / Evaluation
# ============================================================
save_steps: 25
eval_steps: -1

val_files: ./data/verl/no_validation/val.parquet
# ============================================================
# Rollout importance-sampling correction
# ============================================================
rollout_is: token
rollout_is_threshold: 2.0


# ============================================================
# Sequence length
# ============================================================
max_prompt_length: 2048

max_completion_length: 1024

val_max_completion_length: 1024

actor_max_token_len_per_gpu: 20000


# ============================================================
# Training rollout sampling
# ============================================================
temperature: 1.1
top_p: 0.95
top_k_sampling: 20

student_enable_thinking: true


# ============================================================
# Validation sampling
# ============================================================
val_enable_thinking: true
val_do_sample: true

val_n: 12
val_temperature: 0.6
val_top_p: 0.95
val_top_k: 20

# 如果验证 OOM，可以降为 8 或 4
val_batch_size: 16


# ============================================================
# Privileged teacher
# ============================================================
teacher_enable_thinking: true
privileged_text_mode: solution_answer


# ============================================================
# vLLM
# ============================================================
vllm_gpu_memory_utilization: 0.6
vllm_tensor_parallel_size: 1


# ============================================================
# SDPO algorithm parameters
# ============================================================
alpha: 0.5

full_logit_distill: true
distill_add_tail: true

top_k_distill: 100
is_clip: 2.0

teacher_mode: ema
ema_decay: 0.95
# ============================================================
# Hidden-state penalty
# ============================================================
use_hidden_penalty: true

# hidden penalty 在总 loss 中的权重
hidden_penalty_weight: 0.05

# step 0 初始化 snapshot，之后每 25 个 optimizer step 更新
hidden_snapshot_interval: 25

# 更新到 step 175 为止；<= 0 表示不限制
hidden_snapshot_last_step: 1

# ============================================================
# Data
# _run_verl.sh 会切换到项目根目录，因此 ./data 可以正常使用
# ============================================================
data_dir: ./data

train_dataset: openthoughts_math_30k_opsd
val_dataset: amc23,aime24,aime25


# ============================================================
# Output / logging
# ============================================================
output_dir: 

use_swanlab: false

project_name: sdpo-qwen3-4b
experiment_name: qwen3_4b_sdpo_myconfig

val_before_train: false
